[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vist-nrf"
version = "0.1.0"
description = "Visit-Invariant State Tracking under Nonstationary Recording and Follow-up (research only)"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Pranjal Saini" }]
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "torch>=2.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "nbformat>=5.0"]
xgboost = ["xgboost>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["vist_nrf*"]
